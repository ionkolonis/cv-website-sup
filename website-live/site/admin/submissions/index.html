<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- connect to bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- connect to CSS stylesheet -->
        <link href="/static/styles.css" rel="stylesheet">
        <link href="/static/migration.css" rel="stylesheet">

        <title>
            Form submissions
        </title>

        <!-- page icon -->
        <link rel="icon" type="image/png" href="/static/header_icon.png">
    </head>
    <body>
        <a href="/" class="namebox" data-background-folder="/static/bogos/">Ionas Kolonis</a>
        <script src="/static/logos.js"></script>
        <div id="timestamp"></div>
        <main>
            <p id="notice" class="notice" role="status" hidden></p>

            <!-- where the rest of the files will go -->
            
<h1 class="centeredtitletext">Contact form submissions</h1>
<div class="retro-submissions"></div>
<div class="homemenu"><button id="load-more" class="menu-button" hidden>load more</button></div>
<template id="submission-template">            <article class="retro-window">

                <div class="retro-titlebar">
                    <h2></h2>

                    <div class="retro-delete-control">

                        <button class="retro-close retro-trash" type="button" aria-label="Delete submission" title="Delete submission">

                            <!-- trash icon made with help of AI -->
                            <svg
                                width="14"
                                height="14"
                                viewBox="0 0 16 16"
                                fill="currentColor"
                                shape-rendering="crispEdges"
                                aria-hidden="true"
                                focusable="false"
                            >
                                <path d="
                                    M6 1h4v2H6z
                                    M3 3h10v2H3z
                                    M4 6h2v7h4V6h2v9H4z
                                    M7 6h2v6H7z
                                "/>
                            </svg>
                            <!-- end -->

                        </button>
                    </div>
                </div>

                <div class="retro-content">
                    <dl class="retro-details">
                        <div>
                            <dt>name</dt>
                            <dd data-field="name"></dd>
                        </div>

                        <div>
                            <dt>email</dt>
                            <dd data-field="email"></dd>
                        </div>

                        <div>
                            <dt>received</dt>
                            <dd data-field="created_at"></dd>
                        </div>
                    </dl>

                    <div class="retro-message" data-field="content"></div>
                </div>
            </article></template>
<template id="empty-template">            <section class="retro-window">
                <div class="retro-titlebar">
                    <h2>form submissions</h2>
                </div>

                <div class="retro-content">
                    <p class="retro-empty">No submissions yet.</p>
                </div>
            </section>
</template>
<noscript><p class="notice">JavaScript and admin sign-in are required to view submissions.</p></noscript>
<script type="module" src="/static/admin-O37HI7PR.js"></script>


        </main>
        <script src="/static/timestamp.js"></script>

        <footer>
            &#169; Ionas Kolonis 2026

            <!-- display admin menu only on homepage -->
            
        </footer>
    </body>
</html>
